<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RoboMaze live dashboard — ROBOREX 2026 by ELESA, Walchand College of Engineering, Sangli."
    />
    <meta name="theme-color" content="#121212" />
    <title>ROBOREX 2026 · RoboMaze Live Dashboard</title>
    <link rel="icon" type="image/png" href="assets/images/elesa-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Michroma&family=Orbitron:wght@900&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"
    ></script>
  </head>
  <body>
    <header class="main-header">
      <div class="logo-box">
        <img
          src="assets/images/wce-logo.png"
          alt="Walchand College of Engineering logo"
          class="header-logo"
        />
      </div>
      <div class="header-titles">
        <h2 class="clg-name">WALCHAND COLLEGE OF ENGINEERING, SANGLI</h2>
        <div class="elesa-title">ELESA</div>
        <p class="elesa-sub">ELECTRONICS ENGINEERING STUDENTS' ASSOCIATION</p>
      </div>
      <div class="logo-box">
        <img
          src="assets/images/elesa-logo.png"
          alt="ELESA logo"
          class="header-logo"
        />
      </div>
    </header>

    <main class="container">
      <section class="card center">
        <h1 class="roborex-title">ROBORE<span class="red-x">X</span></h1>
      </section>

      <section class="card center">
        <h2>RoboMaze Live</h2>
        <model-viewer
          src="assets/models/model2.glb"
          alt="3D model of the RoboMaze arena"
          loading="lazy"
          auto-rotate
          rotation-per-second="30deg"
          camera-controls
          shadow-intensity="1.5"
          shadow-softness="1"
          tone-mapping="commerce"
          exposure="1.2"
          ar
        ></model-viewer>
      </section>

      <section class="card live-status" aria-live="polite">
        <div>
          <p class="label">
            <span class="live-dot" aria-hidden="true"></span>ON TRACK
          </p>
          <p class="value data-point" id="current">Waiting...</p>
        </div>
        <div>
          <p class="label">NEXT UP</p>
          <p class="value" id="next">---</p>
        </div>
      </section>

      <section class="card">
        <div class="board-head">
          <h3>Live Leaderboard</h3>
          <div class="search-wrap">
            <input
              type="search"
              id="teamSearch"
              placeholder="Search team..."
              aria-label="Search teams in the leaderboard"
              autocomplete="off"
              spellcheck="false"
            />
            <button
              type="button"
              id="searchClear"
              class="search-clear"
              aria-label="Clear search"
              hidden
            >
              &times;
            </button>
          </div>
        </div>
        <p class="search-count" id="searchCount" aria-live="polite"></p>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Rank</th>
                <th>Team</th>
                <th>Raw Time</th>
                <th>Penalties</th>
                <th>Final Time</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody">
              <tr>
                <td colspan="5" class="empty">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="js/index.js"></script>
  </body>
</html>
