<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#121212" />
    <title>ROBOREX 2026 · RoboMaze Admin</title>
    <link rel="icon" type="image/png" href="assets/images/elesa-logo.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="container" style="padding-top: 24px">
      <form id="loginForm" class="card admin-panel">
        <h2>Admin Login</h2>
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="username"
          required
        />
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
        <button id="loginBtn" type="submit">Login</button>
        <p class="status" id="loginStatus" role="status"></p>
      </form>

      <div id="dashboardSection" hidden>
        <section class="card admin-panel">
          <h2>Live Track Control</h2>
          <label for="currentTeam">Current Team Playing</label>
          <input
            type="text"
            id="currentTeam"
            placeholder="e.g. Photon Freaks"
          />
          <label for="nextTeam">Next Team Up</label>
          <input type="text" id="nextTeam" placeholder="e.g. PotatoCPU" />
          <button id="updateLiveBtn" type="button">Update Live Screen</button>
          <p class="status" id="liveStatus" role="status"></p>
          <button id="logoutBtn" type="button" class="btn-danger">
            Logout
          </button>
        </section>

        <section class="card admin-panel">
          <h2>Log Completed Run</h2>
          <p class="hint">
            Submit when a team finishes the maze to add them to the leaderboard.
          </p>
          <label for="logTeam">Team Name</label>
          <input type="text" id="logTeam" placeholder="Team Name" />
          <label for="logTime">Raw Time (MM:SS)</label>
          <input
            type="text"
            id="logTime"
            placeholder="02:30"
            inputmode="numeric"
          />
          <label for="logPenalties">Penalties (+5 sec each)</label>
          <input
            type="number"
            id="logPenalties"
            placeholder="0"
            min="0"
            step="1"
            inputmode="numeric"
          />
          <button id="submitRunBtn" type="button" class="btn-secondary">
            Submit Final Score
          </button>
          <p class="status" id="runStatus" role="status"></p>
        </section>
      </div>
    </main>

    <script type="module" src="js/admin.js"></script>
  </body>
</html>
