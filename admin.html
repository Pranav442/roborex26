<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoboMaze Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card admin-panel">
        <h2>Live Track Control</h2>
        <label>Current Team Playing:</label>
        <input type="text" id="currentTeam" placeholder="e.g. Photon Freaks" />
        <label>Next Team Up:</label>
        <input type="text" id="nextTeam" placeholder="e.g. PotatoCPU" />
        <button id="updateLiveBtn">Update Live Screen</button>
    </div>

    <div class="card admin-panel">
        <h2>Log Completed Run</h2>
        <p style="font-size: 12px; color: #666;">Submit this when a team finishes the maze to add them to the leaderboard.</p>
        <label>Team Name:</label>
        <input type="text" id="logTeam" placeholder="Team Name" />
        <label>Raw Time (MM:SS):</label>
        <input type="text" id="logTime" placeholder="02:30" />
        <label>Penalties (+5 sec each):</label>
        <input type="number" id="logPenalties" placeholder="0" />
        <button id="submitRunBtn" class="btn-secondary">Submit Final Score</button>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
